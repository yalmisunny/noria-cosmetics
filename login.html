    <!-- 3. 로그인 폼 영역 -->
    <section class="login-section">
        <div class="login-container">
            <h2 class="login-title">LOGIN</h2>
            <form class="login-form" action="#" method="POST">
                <div class="input-group">
                    <input type="text" id="username" name="username" placeholder="아이디를 입력해주세요" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요" required>
                </div>
                <div class="login-options">
                    <label class="save-id"><input type="checkbox"> 아이디 저장</label>
                    <div class="find-links">
                        <a href="#">아이디 찾기</a>
                        <span>|</span>
                        <a href="#">비밀번호 찾기</a>
                    </div>
                </div>
                <button type="submit" class="login-btn">로그인</button>
                <button type="button" class="login-btn btn-naver" onclick="alert('네이버 아이디로 로그인합니다!')">
                    <span class="naver-logo">N</span> 네이버 간편 로그인
                </button>
                <div class="signup-link">
                    아직 회원이 아니신가요? <a href="signup.html">회원가입</a>
                </div>
            </form>
        </div>
    </section>

            <div class="social-links">
                <a href="https://blog.naver.com/yalmisunny" target="_blank" title="Naver Blog" class="social-icon naver-icon">N</a>
                <a href="https://www.youtube.com/@%EA%B9%80%EC%B1%84%EC%97%B0-u4k/playlists" target="_blank" title="YouTube" class="social-icon">
