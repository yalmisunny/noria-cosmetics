<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noria - Colour Your Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hero Section -->
  <section class="hero fade-in">
    <div class="hero-image">
      <img src="https://via.placeholder.com/1200x800?text=Hero+Image" alt="Noria Model Face" />
    </div>
    <div class="hero-content">
      <h1 class="brand-title">NORIA</h1>
      <p class="brand-tagline">COLOUR YOUR LIGHT</p>
      <a href="#" class="btn-pill">shop here</a>
    </div>
  </section>

  <!-- Vibe Section -->
  <section class="vibe-section fade-in">
    <img src="https://via.placeholder.com/1600x600?text=Vibe+Section" alt="Woman adorned with pink roses" class="full-width-image" />
  </section>

  <!-- Favorites Section -->
  <section class="favorites fade-in">
    <h2 class="section-title">YOUR FAVORITES</h2>
    <div class="favorites-grid">
      <div class="favorite-item">
        <div class="img-container">
          <img src="https://via.placeholder.com/300?text=Skincare" alt="Skincare" />
        </div>
        <p>SKINCARE</p>
      </div>
      <div class="favorite-item">
        <div class="img-container">
          <img src="https://via.placeholder.com/300?text=Base+Makeup" id="base_makeup_img" alt="Base Makeup" />
        </div>
        <p>BASE MAKEUP</p>
      </div>
      <div class="favorite-item">
        <div class="img-container">
          <img src="https://via.placeholder.com/300?text=Point+Makeup" alt="Point Makeup" />
        </div>
        <p>POINT MAKEUP</p>
      </div>
    </div>
  </section>

  <!-- Offline Section -->
  <section class="offline fade-in">
    <div class="offline-image-container">
      <img src="https://via.placeholder.com/600x400?text=Offline+Section" alt="Scattered Makeup Items" />
    </div>
    <div class="offline-content">
      <h2>Find us offline at your favorite<br/>local malls.</h2>
      <a href="#" class="btn-pill">click here</a>
    </div>
  </section>

  <!-- Stay In Touch Section -->
  <section class="stay-in-touch fade-in">
    <div class="sit-image-wrapper">
      <img src="https://via.placeholder.com/1200x600?text=Stay+In+Touch" alt="Stay in touch model" class="sit-bg" />
      <h2 class="sit-overlay-title">STAY IN TOUCH</h2>
    </div>
    <footer class="site-footer">
      <div class="footer-col">
        <h3>NEWSLETTER</h3>
        <p>Sign up!</p>
      </div>
      <div class="footer-col">
        <h3>EMAIL ADDRESS</h3>
        <p>hello@reallygreatsite.com</p>
      </div>
      <div class="footer-col">
        <h3>SOCIALS</h3>
        <p>@reallygreatsite</p>
      </div>
    </footer>
  </section>

  <script src="main.js"></script>
</body>
</html>
